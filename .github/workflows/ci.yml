name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Node.js for outbound transport compatibility
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.0"

      - name: Check pinned outbound transport on Node.js 22
        run: |
          bun build packages/transport/src/node-smoke.ts --target=node --outfile="$RUNNER_TEMP/transport-smoke.mjs"
          node "$RUNNER_TEMP/transport-smoke.mjs"

      - name: Typecheck and test runtime
        run: bun run validate

  web:
    name: Web, OAuth, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      APP_ORIGIN: https://dashboard.example.test
      CONVEX_SITE_URL: https://example.convex.site
      NEXT_PUBLIC_CONVEX_URL: https://example.convex.cloud
      NEXT_PUBLIC_GATEWAY_URL: https://connect.example.test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck web
        run: bun run typecheck:web

      - name: Test web and Convex contracts
        run: bun run test:convex

      - name: Build production web app
        run: bun run --cwd apps/web build
