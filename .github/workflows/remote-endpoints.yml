name: Remote endpoint contracts

on:
  workflow_dispatch:
  schedule:
    # 09:17 Asia/Jakarta. A daily probe catches upstream drift after a green merge.
    - cron: "17 2 * * *"
  pull_request:
    paths:
      - "adapters/remote-mcp/connectors/**"
      - "adapters/remote-mcp/src/verify-endpoints.ts"
      - "packages/core/src/connector.ts"
      - "packages/schemas/connector-manifest.schema.json"
  push:
    branches: [main]
    paths:
      - "adapters/remote-mcp/connectors/**"
      - "adapters/remote-mcp/src/verify-endpoints.ts"
      - "packages/core/src/connector.ts"
      - "packages/schemas/connector-manifest.schema.json"

permissions:
  contents: read

concurrency:
  group: remote-endpoints-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Credential-free OAuth discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify reviewed production endpoints
        run: bun run verify:remote-endpoints
